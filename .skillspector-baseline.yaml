# SkillSpector baseline for this repository's own distributed skill (release gate ratchet).
# Scan scope: git-tracked + trackable-untracked files (git ls-files --cached --others
# --exclude-standard), staged to a temp dir -- this mirrors what `git clone` actually ships
# as the installed skill (see docs/install.md) and excludes local-only artifacts (.venv,
# .ruff_cache, __pycache__, generated books/output) that are gitignored and would make
# fingerprints unstable across machines.
# Every entry below is an ALREADY-REVIEWED finding accepted at baseline creation time.
# New findings are NOT suppressed automatically -- they fail tools/dev_check.ps1 until
# someone reviews them and adds a fingerprint + reason here (or fixes the content).
version: 2
scanner_version: 2.12.0
# reviewed_partials: files a bounded static parser could not finish, reviewed by hand.
# tools/run_skillspector.py strips this key before the scanner reads the baseline;
# tools/check_skillspector_report.py accepts the matching degraded analyzer only while
# the file's SHA-256 (as staged, LF) still equals `sha256`.
reviewed_partials:
- path: README.en.md
  analyzer: static_patterns_tool_misuse
  reason_code: static_parse_limit
  sha256: a334006e79dbe211e617df5ae9570aed4196f787f078c2ab10daa3e64cd6a005
  reason: "2026-10-24 隨 SkillSpector 2.12.0 審閱：英文入口說明（267 行）。2.12.0 的工具濫用分析器在長段落上碰到跨度上限；人工審過沒有管線執行、遠端腳本、權限放寬或編碼字串，只有安裝與使用範例。"
- path: SKILL.md
  analyzer: static_patterns_tool_misuse
  reason_code: static_parse_limit
  sha256: 4a6932bb4baf18fb491aba44ae0798f3c7f8ddb582044074360b4da6e21beaf1
  reason: "2026-10-24 隨 SkillSpector 2.12.0 審閱：轉換器產品規格（787 行，Steps 0–10）。2.12.0 的工具濫用分析器在長段落上碰到跨度上限；人工審過內容是給宿主 agent 的抽取與安裝步驟，沒有管線執行、遠端腳本或編碼字串。"
rules:
- id: SC4
  path: requirements-security.txt
  message: skillspector
  reason: "2026-10-24 改為樣式規則：這筆 finding 的內容來自即時 OSV 查詢，兩次掃描的精確指紋不同，無法用 exact fingerprint 鎖定；範圍限定在本檔、套件名稱 skillspector。OSV 以套件名稱查到 MAL-2026-6561：PyPI 上一個冒充 NVIDIA/skillspector、夾帶預設開啟遙測的惡意套件（0.0.1–2.3.10，已下架）。本 repo 以 git URL 釘 SanHsien/SkillSpector 的精確 commit 安裝，不經 PyPI，不受影響；不得改成從 PyPI 安裝 skillspector。"
- id: PE3
  path: .gitignore
  message: '*.env*'
  reason: 已人工審查：.gitignore 的 .env 與 .env.* 是避免本機憑證檔被提交的安全排除規則，不會讀取或外傳憑證。
- id: PE3
  path: tests/test_scan_coverage.py
  message: '*.env*'
  reason: 已人工審查：.env 外傳句是掃描器回歸測試的惡意 fixture，測試要求偵測並拒絕，不是 production 行為。
- id: PE3
  path: tests/test_scan_generated_skill.py
  message: '*.env*'
  reason: 已人工審查：.env 外傳句是 generated-skill 掃描器的惡意 fixture，測試要求偵測並拒絕，不是 production 行為。
- id: PE2
  path: book_to_skill/dependencies.py
  message: '*sudo*'
  reason: 已人工審查：dependencies.py 只在缺少 poppler 時回傳 sudo apt install 的人工安裝提示；程式不會呼叫 sudo，子程序僅執行已驗證的轉檔工具。
- id: PE2
  path: README.md
  message: '*sudo*'
  reason: 自我指涉：sudo apt install 是中文版 README 提供給 Linux 使用者手動安裝 poppler-utils 的說明，程式不會自行提權或執行 sudo。
- id: PE2
