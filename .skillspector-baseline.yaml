# SkillSpector baseline for this repository's own distributed skill (release gate ratchet).
# Scan scope: git-tracked + trackable-untracked files (git ls-files --cached --others
# --exclude-standard), staged to a temp dir -- this mirrors what `git clone` actually ships
# as the installed skill (see docs/install.md) and excludes local-only artifacts (.venv,
# .ruff_cache, __pycache__, generated books/output) that are gitignored and would make
# fingerprints unstable across machines.
# Every entry below is an ALREADY-REVIEWED finding accepted at baseline creation time.
# New findings are NOT suppressed automatically -- they fail tools/dev_check.ps1 until
# someone reviews them and adds a fingerprint + reason here (or fixes the content).
version: 2
scanner_version: 2.11.0
rules:
- id: PE3
  path: .gitignore
  message: '*.env*'
  reason: 已人工審查：.gitignore 的 .env 與 .env.* 是避免本機憑證檔被提交的安全排除規則，不會讀取或外傳憑證。
- id: PE3
  path: tests/test_scan_coverage.py
  message: '*.env*'
  reason: 已人工審查：.env 外傳句是掃描器回歸測試的惡意 fixture，測試要求偵測並拒絕，不是 production 行為。
- id: PE3
  path: tests/test_scan_generated_skill.py
  message: '*.env*'
  reason: 已人工審查：.env 外傳句是 generated-skill 掃描器的惡意 fixture，測試要求偵測並拒絕，不是 production 行為。
- id: PE2
  path: book_to_skill/dependencies.py
  message: '*sudo*'
  reason: 已人工審查：dependencies.py 只在缺少 poppler 時回傳 sudo apt install 的人工安裝提示；程式不會呼叫 sudo，子程序僅執行已驗證的轉檔工具。
- id: PE2
  path: README.md
  message: '*sudo*'
  reason: 自我指涉：sudo apt install 是中文版 README 提供給 Linux 使用者手動安裝 poppler-utils 的說明，程式不會自行提權或執行 sudo。
- id: PE2
  path: README.en.md
  message: '*sudo*'
  reason: 自我指涉：sudo apt install 是英文版 README 提供給 Linux 使用者手動安裝 poppler-utils 的說明，程式不會自行提權或執行 sudo。
- id: RP1
  path: CONTRIBUTING.md
  reason: 自我指涉：文件中的 npx skills add 是跨 host 的使用者安裝指令，不是本 skill 綁定執行的 MCP server 設定。
- id: RP1
  path: README.en.md
  reason: 自我指涉：文件中的 npx skills add 是跨 host 的使用者安裝指令，不是本 skill 綁定執行的 MCP server 設定。
- id: RP1
  path: README.md
  reason: 自我指涉：文件中的 npx skills add 是跨 host 的使用者安裝指令，不是本 skill 綁定執行的 MCP server 設定。
- id: RP1
  path: SECURITY-NOTICE.md
  reason: 自我指涉：文件中的 npx skills add 是跨 host 的使用者安裝指令，不是本 skill 綁定執行的 MCP server 設定。
- id: RP1
  path: docs/index.md
  reason: 自我指涉：文件中的 npx skills add 是跨 host 的使用者安裝指令，不是本 skill 綁定執行的 MCP server 設定。
- id: RP1
  path: docs/install.md
  reason: 自我指涉：npx skills add 是使用者完成轉換後安裝產出 skill 的文件範例，不是本 skill 綁定執行的未鎖版 MCP server。
- id: RP1
  path: docs/usage.md
  reason: 自我指涉：文件中的 npx skills add 是跨 host 的使用者安裝指令，不是本 skill 綁定執行的 MCP server 設定。
- id: AST4
  path: tests/test_repo_hygiene.py
  message: '*subprocess*'
  reason: 已人工審查：測試 helper 以 shell false 的固定 argv 陣列呼叫 git，輸入為測試常數且有 30 秒 timeout，不拼接 shell。
